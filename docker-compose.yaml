networks:
  homeos-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: homeos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeos_password}
      POSTGRES_DB: ${POSTGRES_DB:-homeos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homeos-network

  redis:
    image: redis:7-alpine
    container_name: homeos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homeos-network

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile.yaml
    container_name: homeos-auth
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-homeos}:${POSTGRES_PASSWORD:-homeos_password}@postgres:5432/homeos
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./common:/app/common:ro
    networks:
      - homeos-network

  frontend:
    build:
      context: ./0_Frontend       # Zmieniony kontekst na folder z Dockerfile
      dockerfile: Dockerfile.yaml
    container_name: homeos-frontend
    ports:
      - "5173:5173"
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./0_Frontend/HomeOS   # Synchronizujemy TYLKO kod aplikacji
          target: /app                # Zgadza się z WORKDIR w Dockerfile
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          # Ścieżka prowadzi teraz idealnie do pliku
          path: ./0_Frontend/HomeOS/package.json 
    depends_on:
      - auth
    networks:
      - homeos-network

  nginx:
    image: nginx:latest
    container_name: homeos-nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - auth
      - frontend
      - init-certs
    networks:
      - homeos-network
  
  init-certs:
    image: alpine/openssl
    container_name: homeos-init-certs
    entrypoint: /bin/sh
    volumes:
      - ./nginx/certs:/certs
    command: >
      -c "if [ ! -f /certs/server.crt ]; then
              echo 'Generating self-signed certificate...';
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /certs/server.key -out /certs/server.crt -subj '/CN=localhost';
              chmod 644 /certs/server.key /certs/server.crt;
            else
              echo 'Certificate already exists.';
            fi"

volumes:
  postgres_data:
  redis_data: