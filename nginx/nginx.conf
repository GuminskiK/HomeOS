events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 1. Definiujemy nasze mikroserwisy (Upstreamy) za pomocą wewnętrznych nazw i portów Dockera
    upstream frontend_backend {
        server homeos-frontend:5173; 
    }

    upstream auth_backend {
        server homeos-auth:8000;
    }

    # Definicja strefy limitu żądań (Rate Limiting)
    # limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

    # Resolver DNS Dockera - potrzebny przy dynamicznych nazwach kontenerów
    resolver 127.0.0.11 valid=15s;

    # Przekierowanie HTTP -> HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Główny serwer HTTPS (API Gateway / Reverse Proxy)
    server {
        listen 443 ssl;
        server_name localhost;
        
        client_max_body_size 25M;

        # Certyfikaty SSL
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Bezpieczne ustawienia SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Wspólne nagłówki proxy dla wszystkich lokalizacji (uproszczenie konfiguracji)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Globalny limit żądań aplikowany do wszystkich endpointów (opcjonalnie)
        #limit_req zone=general_limit burst=20 nodelay;

        # 2. Backend API (Auth Service)
        # Obsługuje /api, /docs oraz /openapi.json przekierowując do auth_backend
        location /api {
            rewrite ^/api/(.*) /$1 break; # Obcina /api z adresu, przekazuje resztę
            proxy_pass http://auth_backend;
        }

        # Dokumentacja API (Swagger/FastAPI generuje je zazwyczaj na roocie)
        location /docs {
            proxy_pass http://auth_backend;
        }
        
        location /openapi.json {
            proxy_pass http://auth_backend;
        }

        # 3. Frontend (Łapie cały pozostały ruch)
        location / {
            proxy_pass http://frontend_backend;
            
            # Wsparcie dla WebSockets (np. dla Vite Dev Server / HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}